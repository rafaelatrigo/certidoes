name: Atualizar certidões

on:
  schedule:
    - cron: "17 9 * * 1-5"   # dias úteis, 06:17 de Brasília
  push:
    paths: ["dados/**", "config/**"]   # ao editar os lançamentos manuais, a tela atualiza sozinha
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reemitir tudo, mesmo o que ainda está válido (gera custo)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-certidoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests cryptography

      - name: Consultar fontes
        env:
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          INFOSIMPLES_TOKEN: ${{ secrets.INFOSIMPLES_TOKEN }}
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
          FORCAR: ${{ inputs.forcar }}
        run: python robo/atualizar.py

      - name: Publicar resultado
        run: |
          git config user.name "robo-certidoes"
          git config user.email "robo-certidoes@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualização das certidões $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
            git push
          fi
